version: 2

# Kept quiet on purpose: monthly, and every update for a folder lands in at most
# two PRs (safe minor/patch bumps, and major bumps that may need code changes).
# Security fixes are batched into one PR per folder too.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]
      frontend-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
      backend-major:
        update-types: [major]
      backend-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
