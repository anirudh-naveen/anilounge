services:
  postgres:
    image: postgres:16
    container_name: anilounge-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: anilounge
    ports:
      - '5432:5432'
    volumes:
      - anilounge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d anilounge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anilounge_pg:
