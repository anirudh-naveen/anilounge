<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <link rel="apple-touch-icon" href="/favicon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#152238" />
    <meta
      name="description"
      content="AniLounge — settle in, discover, and track animated films and series."
    />
    <meta property="og:site_name" content="AniLounge" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AniLounge" />
    <meta
      property="og:description"
      content="AniLounge — settle in, discover, and track animated films and series."
    />
    <meta property="og:image" content="https://www.anilounge.net/anilounge-logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AniLounge</title>
    <script>
      // Apply the saved theme before first paint (see src/composables/useTheme.ts).
      try {
        var saved = localStorage.getItem('anilounge-theme')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
